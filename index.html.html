<head>

<title>PetStock — Inventário de Fim de Ano</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23168A36'/%3E%3Cpath d='M9 17l5 5 9-11' stroke='%23fff' stroke-width='3' fill='none'/%3E%3C/svg%3E">
<style>
:root{--g:#168A36;--gd:#11652B;--gl:#E9F7EC;--b:#123B66;--bg:#F7F9F7;--s:#fff;--t:#202B24;--t2:#69766D;--br:#E1E8E2;--e:#C62828}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.45 system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:12px 14px 100px}
header{background:var(--s);border-bottom:1px solid var(--br);position:sticky;top:0;z-index:5}
.hd{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 14px}
.hd img{width:40px;height:40px;border-radius:50%}.hd b{color:var(--b);font-size:18px}.hd small{display:block;color:var(--t2);font-size:12px}.hd div{flex:1;min-width:0}
h1,h2,h3{color:var(--b);margin:.4em 0}h2{font-size:19px}h3{font-size:16px}
.card{background:var(--s);border:1px solid var(--br);border-radius:12px;padding:14px;margin:10px 0}
label{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}
input,select,textarea,button{font:inherit;min-height:44px;border-radius:10px}
input,select,textarea{width:100%;padding:8px 12px;border:1px solid var(--br);background:#fff;color:var(--t)}
input[type=checkbox]{width:22px;min-height:22px;margin-right:8px}
.chk{display:flex;align-items:center;font-weight:400}
button{border:1px solid var(--g);background:var(--s);color:var(--gd);padding:8px 14px;font-weight:600;cursor:pointer}
button.p{background:var(--g);color:#fff}button.d{border-color:var(--e);color:var(--e)}button:disabled{opacity:.5}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--b);outline-offset:1px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.row>button{flex:0 0 auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--gl);border-radius:12px;padding:12px}.kpi b{display:block;font-size:22px;color:var(--gd)}.kpi span{font-size:13px;color:var(--t2)}
.bar{height:12px;background:var(--br);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
[hidden]{display:none!important}
nav{position:fixed;bottom:0;left:0;right:0;background:#2B2F2D;border-top:1px solid #1c1f1d;display:flex;z-index:5}
nav button{flex:1;border:0;border-radius:0;min-height:62px;background:transparent;color:#fff;font-size:18px;font-weight:600}nav button.on{background:#3A403D;box-shadow:inset 0 4px #4CC36B}nav button:focus-visible{outline-color:#fff;outline-offset:-4px}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--br)}.item:last-child{border:0}
.item .i{flex:1;min-width:0}.item .i b{display:block;overflow-wrap:anywhere}.item small{color:var(--t2)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--gl);color:var(--gd)}.tag.w{background:#FFF3E0;color:#8a4b00}
.ok{min-width:44px;padding:0}.ok.on{background:var(--g);color:#fff}
details{background:var(--s);border:1px solid var(--br);border-radius:12px;margin:10px 0;padding:0 14px}summary{cursor:pointer;min-height:48px;display:flex;align-items:center;font-weight:700;color:var(--b)}
dialog{border:0;border-radius:14px;padding:16px;width:min(94vw,520px);max-height:92vh}dialog::backdrop{background:#0006}
.err{color:var(--e);font-size:14px;min-height:20px}.note{font-size:13px;color:var(--t2)}
.logo{display:block;margin:6px auto;width:min(60vw,240px)}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--t);color:#fff;padding:10px 16px;border-radius:10px;z-index:20;display:none;max-width:92vw}#toast.err{background:var(--e)}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>
</head>

const API_URL = 'https://dxesnsajxvtspfjylmzk.supabase.co/functions/v1/petstock-api';

let sessionToken = null;

const Store = {
  async request(action, data = {}) {
    const headers = {
      'Content-Type': 'application/json',
      'apikey': 'sb_publishable_GzVOkBR3GHNElwVbTqvvng_AVZa7Fn4',
    };

    if (sessionToken) {
      headers['x-petstock-session'] = sessionToken;
    }

    const response = await fetch(API_URL, {
      method: 'POST',
      headers,
      body: JSON.stringify({
        action,
        ...data,
      }),
    });

    const result = await response.json().catch(() => ({}));

    if (!response.ok || result.error) {
      throw new Error(
        result.error || 'Não foi possível comunicar com o servidor.'
      );
    }

    return result;
  },

  async open(code, pin) {
    const result = await this.request('open_inventory', {
      code: code.trim().toUpperCase(),
      pin,
    });

    sessionToken = result.session_token;
    return result;
  },

  async close() {
    try {
      if (sessionToken) {
        await this.request('close_session');
      }
    } finally {
      sessionToken = null;
    }
  },

  async listItems() {
    return this.request('list_items');
  },


  async addItem(item) {
    return this.request('add_item', {
      name: item.name,
      category: item.category,
      unit: item.unit,
      quantity: item.quantity,
      unit_cost: item.unit_cost,
      notes: item.notes,
      counted: item.counted
    });
  },


  async updateItem(item) {
    return this.request('update_item', {
      id: item.id,
      name: item.name,
      category: item.category,
      unit: item.unit,
      quantity: item.quantity,
      unit_cost: item.unit_cost,
      notes: item.notes,
      counted: item.counted
    });
  },


  async deleteItem(id) {
    return this.request('delete_item', { id });
  },


  async updateInventoryStatus(status) {
    return this.request('update_inventory_status', { status });
  },

  async updateInventoryNotes(notes) {
    return this.request('update_inventory_notes', { notes });
  },

  async publicCreate(data) {
    const result = await this.request('public_create_inventory', data);

    if (!result.session_token) {
      throw new Error('Inventário criado, mas a sessão não foi retornada.');
    }

    sessionToken = result.session_token;
    return result;
  },
};

/* ===== Segurança local: PBKDF2 + limite de tentativas + sessão só em memória ===== */
const b64=u=>btoa(String.fromCharCode(...u)),unb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function hashPin(pin,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);return b64(new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},k,256)))}

  clearTimeout(idle);

  } finally {
    cur = null;

/* ===== Persistência com controle de versão (detecta conflito entre abas) ===== */
function commit(mut){
  const d=Store.load();d.inv=d.inv||{};d.cats=d.cats||{};
  const s=d.inv[cur.code];
  if(s&&s.version!==cur.version){cur=s;toast('Conflito: o inventário foi alterado em outra aba. Dados recarregados, repita a ação.','err');render();return false}
  const copy=JSON.parse(JSON.stringify(cur));
  try{mut(copy,d);copy.version++;copy.updated_at=new Date().toISOString();d.inv[copy.code]=copy;Store.save(d)}
  catch(e){toast('Falha ao salvar. Nada foi alterado.','err');return false}
  cur=copy;toast('Salvo');touch();return true;
}

function sum(it){const t=it.length,c=it.filter(i=>i.counted).length;
  return{t,c,p:t-c,u:it.reduce((a,i)=>a+i.quantity,0),v:it.reduce((a,i)=>a+(i.unit_cost!=null?i.quantity*i.unit_cost:0),0),nc:it.filter(i=>i.unit_cost==null).length,pct:t?Math.round(c/t*100):0}}
const val=i=>i.unit_cost!=null?i.quantity*i.unit_cost:null;
function filtered(){
  let r=cur.items.filter(i=>(!F.q||i.name.toLowerCase().includes(F.q.toLowerCase()))&&(!F.cat||i.category===F.cat)&&(!F.st||(F.st==='c')===i.counted));
  const s={az:(a,b)=>a.name.localeCompare(b.name,'pt'),qty:(a,b)=>b.quantity-a.quantity,val:(a,b)=>(val(b)??-1)-(val(a)??-1)};
  return r.sort(s[F.sort]);
}

async function login() {
  const code = $('#ci').value.trim().toUpperCase();
  const pin = $('#cp').value;
  const button = $('#go');
  const error = $('#e1');

  error.textContent = '';

  if (!code || !pin) {
    error.textContent = 'Informe o ID e o PIN.';
    return;
  }

  button.disabled = true;

  try {
    const result = await Store.open(code, pin);
    const inventory = result.inventory;
    const itemsResult = await Store.listItems();
    const shop = inventory.shop || {};

    cur = {
      ...inventory,
      code: inventory.public_code,
      responsible: inventory.responsible_name || '',
      status: {
        draft: 'andamento',
        in_progress: 'andamento',
        completed: 'concluido',
        cancelled: 'concluido'
      }[inventory.status] || inventory.status,
      shop: {
        name: shop.name || '',
        cnpj: shop.cnpj || '',
        legal: shop.legal_name || '',
        address: shop.address || ''
      },
      shopKey: inventory.pet_shop_id || shop.id || inventory.id,
      items: (itemsResult.items || []).map(item => ({
        ...item,
        unit_cost: item.unit_cost
      }))
    };

    tab = 'home';
    touch();
    render();
  } catch (err) {
    error.textContent =
      err.message || 'Não foi possível entrar no inventário.';
  } finally {
    button.disabled = false;
  }
}


async function create() {
  const g = id => $('#' + id).value.trim();
  const error = $('#e2');
  const button = document.querySelector('#n4')?.closest('form')?.querySelector('[type="submit"]');

  error.textContent = '';

  const name = g('n1');
  const title = g('n2');
  const responsible_name = g('n3');
  const pin = $('#n4').value;
  const cnpj = g('x1');
  const legal_name = g('x2');
  const address = g('x3');

  if (!name || !title) {
    error.textContent = 'Informe o nome do pet shop e o título.';
    return;
  }

  if (!/^\d{6,8}$/.test(pin)) {
    error.textContent = 'O PIN deve ter de 6 a 8 números.';
    return;
  }

  if (cnpj && cnpj.replace(/\D/g, '').length !== 14) {
    error.textContent = 'Confira o CNPJ informado.';
    return;
  }

  if (button) button.disabled = true;

  try {
    const result = await Store.publicCreate({
      name,
      title,
      responsible_name,
      pin,
      cnpj,
      legal_name,
      address
    });

    const inventory = result.inventory;

    cur = {
      ...inventory,
      code: result.access_code || inventory.public_code,
      responsible: responsible_name,
      status: 'andamento',
      notes: '',
      shop: {
        name,
        cnpj,
        legal: legal_name,
        address
      },
      shopKey: inventory.pet_shop_id || inventory.id,
      items: [],
      created_at: new Date().toISOString(),
      updated_at: new Date().toISOString(),
      completed_at: null,
      version: 1
    };

    tab = 'home';
    touch();
    render();

    alert(
      'Inventário criado com sucesso!\n\n' +
      'ID: ' + cur.code + '\n\n' +
      'Guarde o ID e o PIN em local seguro. ' +
      'O PIN não pode ser recuperado.'
    );
  } catch (err) {
    error.textContent =
      err.message || 'Não foi possível criar o inventário.';
  } finally {
    if (button) button.disabled = false;
  }
}

function dash(){
  const s=sum(cur.items),st={andamento:'Em andamento',concluido:'Concluído'}[cur.status]||'Reaberto';
  $('#app').innerHTML=`<h2>${esc(cur.title)}</h2><p class="note">${esc(cur.shop.name)} · <span class="tag${locked()?'':' w'}">${st}</span> · Atualizado em ${fdt(cur.updated_at)}</p>
  <div class="card"><b>${s.pct}% conferido</b><div class="bar" role="progressbar" aria-valuenow="${s.pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${s.pct}%"></i></div></div>
  <div class="grid"><div class="kpi"><b>${s.t}</b><span>Produtos</span></div><div class="kpi"><b>${s.c}</b><span>Conferidos</span></div><div class="kpi"><b>${s.p}</b><span>Pendentes</span></div>
  <div class="kpi"><b>${num(s.u)}</b><span>Total de unidades</span></div><div class="kpi" style="grid-column:span 2"><b>${brl(s.v)}</b><span>Valor estimado</span></div></div>
  ${s.nc?`<p class="note">⚠ ${s.nc} produto(s) sem custo informado ficaram fora do valor estimado. A soma de unidades mistura unidades de medida diferentes. Valores são estimativas, não contábeis ou fiscais.</p>`:'<p class="note">Valor estimado, não contábil ou fiscal.</p>'}
  <div class="card"><label for="ob">Observações gerais</label><textarea id="ob" rows="3" ${locked()?'disabled':''}>${esc(cur.notes)}</textarea>
  ${locked()?'':'<button id="sv" style="margin-top:8px">Salvar observações</button>'}</div>
  <div class="card">${locked()?'<button id="re" style="width:100%">Reabrir inventário</button>':'<button class="p" id="fin" style="width:100%">Concluir inventário</button>'}</div>`;
  const sv = $('#sv');

  if (sv) {
    sv.onclick = async () => {
      const notes = $('#ob').value.slice(0, 2000);

      sv.disabled = true;

      try {
        await Store.updateInventoryNotes(notes);

        cur.notes = notes;
        cur.updated_at = new Date().toISOString();

        toast('Observações salvas com sucesso.');
        render();
      } catch (err) {
        toast(
          err.message || 'Não foi possível salvar as observações.',
          'err'
        );
      } finally {
        sv.disabled = false;
      }
    };
  }

  const fin = $('#fin');

  if (fin) {
    fin.onclick = async () => {
      const pending = cur.items.filter(item => !item.counted).length;

      const message =
        (pending ? pending + ' produto(s) ainda não conferido(s). ' : '') +
        'Concluir o inventário? Ele ficará bloqueado para edição.';

      if (!confirm(message)) return;

      fin.disabled = true;

      try {
        await Store.updateInventoryStatus('completed');

        cur.status = 'concluido';
        cur.completed_at = new Date().toISOString();

        render();
        toast('Inventário concluído com sucesso.');
      } catch (err) {
        fin.disabled = false;
        toast(err.message || 'Não foi possível concluir o inventário.', 'err');
      }
    };
  }


  const re = $('#re');

  if (re) {
    re.onclick = async () => {
      if (!confirm('Reabrir o inventário para edição?')) return;

      re.disabled = true;

      try {
        await Store.updateInventoryStatus('in_progress');

        cur.status = 'andamento';
        cur.completed_at = null;

        render();
        toast('Inventário reaberto com sucesso.');
      } catch (err) {
        re.disabled = false;
        toast(err.message || 'Não foi possível reabrir o inventário.', 'err');
      }
    };
  }

}

      return;

      return;

      const product = {
        id: it?.id,
        name: n,
        category,
        unit: u,
        quantity: q,
        unit_cost: c,
        notes,
        counted
      };

      const result = it
        ? await Store.updateItem(product)
        : await Store.addItem(product);

      if (!result.item) {
        throw new Error('A API não retornou o produto salvo.');
      }

      const savedItem = result.item;

      if (it) {
        cur.items = cur.items.map(item =>
          item.id === savedItem.id ? savedItem : item
        );
      } else {
        cur.items = [...(cur.items || []), savedItem];
      }

      $('#dlg').close();
      render();

      toast(it
        ? 'Produto atualizado com sucesso.'
        : 'Produto adicionado com sucesso.');
    } catch (err) {
      e.textContent = err.message || 'Não foi possível salvar o produto.';
    } finally {
      button.disabled = false;
    }
  };

  const fd = $('#fd');

  if (fd) {
    fd.onclick = async () => {
      if (!confirm('Excluir "' + it.name + '"? Esta ação não pode ser desfeita.')) {
        return;
      }

      fd.disabled = true;

      try {
        await Store.deleteItem(id);

        cur.items = cur.items.filter(item => item.id !== id);

        $('#dlg').close();
        render();
        toast('Produto excluído com sucesso.');
      } catch (err) {
        toast(err.message || 'Não foi possível excluir o produto.', 'err');
      } finally {
        fd.disabled = false;
      }
    };
  }
}

    const pend=inv.items.filter(i=>!i.counted),sc=inv.items.filter(i=>i.unit_cost==null);
    const obs=[H('Observações gerais e divergências'),P(inv.notes||'Sem observações gerais.'),
      P(pend.length?'Itens não conferidos: '+pend.map(i=>i.name).join('; ')+'.':'Todos os itens foram conferidos.'),
      P(sc.length?'Itens sem custo informado (fora do valor estimado): '+sc.map(i=>i.name).join('; ')+'.':'Todos os itens possuem custo informado.'),
      ...inv.items.filter(i=>i.notes).map(i=>P(i.name+': '+i.notes))];
    const ident=[new D.Paragraph({children:[new D.PageBreak()]}),H('Identificação e Informações Adicionais'),P('Estabelecimento: '+inv.shop.name),P('Razão social: '+(inv.shop.legal||'Não informada')),P('CNPJ: '+(inv.shop.cnpj||'Não informado')),P('Endereço comercial: '+(inv.shop.address||'Não informado')),P('Responsável: '+(inv.responsible||'Não informado'))];
    const doc=new D.Document({creator:'PetStock',title:inv.title,sections:[{properties:{page:{margin:{top:1134,bottom:1134,left:1134,right:1134}}},
      headers:{default:new D.Header({children:[new D.Paragraph({alignment:D.AlignmentType.RIGHT,children:[new D.TextRun({text:'PetStock — '+inv.shop.name,color:G,size:18,font:'Calibri'})]})]})},
      footers:{default:new D.Footer({children:[new D.Paragraph({alignment:D.AlignmentType.CENTER,children:[new D.TextRun({text:inv.code+' · Página ',size:18,color:'69766D',font:'Calibri'}),new D.TextRun({children:[D.PageNumber.CURRENT],size:18,color:'69766D',font:'Calibri'})]})]})},
      children:[...cover,...resumo,...cats,...obs,...ident]}]});
    const blob=await D.Packer.toBlob(doc),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='PetStock_Inventario_'+inv.code+'.docx';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    toast('Relatório gerado.');
  }catch(e){toast(e.message==='lib'?'Biblioteca de Word não carregou. Verifique a conexão e tente de novo.':'Falha ao gerar o relatório. Tente novamente.','err')}
  btn.disabled=false;btn.textContent='Gerar e baixar relatório';
}

/* ===== Eventos globais ===== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a],[data-tab]');if(!t)return;touch();
  if(t.dataset.tab){tab=t.dataset.tab;render()}
  else if(t.dataset.a==='ed')form(t.dataset.id);
  else if(t.dataset.a==='tg'&&!locked())commit(c=>{const i=c.items.find(x=>x.id===t.dataset.id);i.counted=!i.counted})&&render();
});
$('#out').onclick=logout;
window.addEventListener('beforeunload',e=>{if($('#dlg').open){e.preventDefault();e.returnValue=''}});
render();
</script>
